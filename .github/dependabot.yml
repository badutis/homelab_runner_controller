# Weekly update PRs for the pinned CI actions and the hashed dev and release tools.
# WakeCI itself has no dependencies. A version update waits until the release is 14 days
# old, so a broken or hijacked release has time to be noticed first. Security updates
# (Dependabot security updates, on for this repository) are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: build
