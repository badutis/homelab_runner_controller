name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners on purpose: the self-hosted machines are the ones this
# controller puts to sleep, so a broken controller must not block its own fix.
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.9 is the oldest supported; 3.13 is what Debian 13 ships.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck machine/install.sh machine/rack-sleep orangepi/install.sh orangepi/deploy.sh tests/install_smoke.sh scripts/pre-push scripts/install-hooks.sh

  # Installs the controller from scratch on a clean Ubuntu with systemd, as the board
  # would get it from orangepi/deploy.sh, and starts it with fake tokens.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/install_smoke.sh

  public-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The branch itself, not GitHub's temporary merge commit: that commit is not part
      # of the history and carries whatever author email GitHub picked for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/public_safe.py --history
