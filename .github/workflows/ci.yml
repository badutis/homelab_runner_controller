name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners on purpose: the self-hosted machines are the ones this
# controller puts to sleep, so a broken controller must not block its own fix.
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.9 is the oldest supported; 3.13 is what Debian 13 ships.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      # The package installs and its command works, with no dependencies.
      - run: python -m pip install --no-deps .
      - run: wakeci version
      - run: wakeci check controller/config.example.json

  # Lint, formatting and types, with the tools pinned by hash (requirements-dev.txt).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: coverage run -m unittest discover -s tests -t .
      # Fails below fail_under in pyproject.toml.
      - run: coverage report

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck machine/install.sh machine/wakeci-sleep controller/install.sh controller/deploy.sh tests/install_smoke.sh scripts/pre-push scripts/install-hooks.sh

  # Installs the controller from scratch on a clean Ubuntu with systemd, as a host would
  # get it from controller/deploy.sh, and starts it with fake tokens: on x86_64 here and on
  # arm64 below (free for public repositories). 32-bit ARM has no GitHub-hosted runner.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/install_smoke.sh

  install-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/install_smoke.sh

  # Every commit of a pull request is signed off (Developer Certificate of Origin).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/dco.py "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  public-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The branch itself, not GitHub's temporary merge commit: that commit is not part
      # of the history and carries whatever author email GitHub picked for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/public_safe.py --history
