[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wakeci"
dynamic = ["version"]
description = "Wakes self-hosted GitHub Actions runner machines for queued jobs and suspends idle ones."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "badutis" }]
keywords = ["github-actions", "self-hosted-runner", "wake-on-lan", "ci", "power-saving", "homelab"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Power (UPS)",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/badutis/wakeci"
Issues = "https://github.com/badutis/wakeci/issues"
Changelog = "https://github.com/badutis/wakeci/blob/main/CHANGELOG.md"

[project.scripts]
wakeci = "wakeci.cli:main"

[tool.setuptools]
packages = ["wakeci"]

[tool.setuptools.dynamic]
version = { attr = "wakeci.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, isort, pyupgrade (for 3.9) and simplify.
select = ["E", "W", "F", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"  # the oldest mypy 2 can target; 3.9 itself is covered by the test matrix
files = ["wakeci", "controller/check_config.py", "scripts/public_safe.py", "scripts/release.py", "scripts/dco.py"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["wakeci"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
